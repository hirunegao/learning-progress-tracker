const sel=document.getElementById('courseFilter');courses.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.name;sel.appendChild(o)});
function toggleBody(el){el.nextElementSibling.classList.toggle('open');el.classList.toggle('collapsed')}
function toggle(cb,key){localStorage.setItem(key,cb.checked?'1':'0');if(cb.checked&&!localStorage.getItem(key+'_date')){const today=new Date().toISOString().split('T')[0];const d=cb.parentElement.querySelector('.ch-date');if(d){d.value=today;localStorage.setItem(key+'_date',today)}}updateSummary()}
function setDate(input,key){localStorage.setItem(key,input.value)}
function updateSummary(){let t=0,d=0;const f=document.getElementById('courseFilter').value;const list=f==='all'?courses:[courses[parseInt(f)]];list.forEach((c,ci)=>{const idx=f==='all'?ci:parseInt(f);c.lessons.forEach((l,li)=>{let ld=0;l.chapters.forEach((ch,chi)=>{t++;const k='c'+idx+'l'+li+'ch'+chi;if(localStorage.getItem(k)==='1'){d++;ld++}});const lp=document.getElementById('lp_'+idx+'_'+li);if(lp)lp.textContent=ld+'/'+l.chapters.length+' 完了'})});const p=t>0?Math.round(d/t*100):0;const cd=list.filter((c,ci)=>{const idx=f==='all'?ci:parseInt(f);return c.lessons.every((l,li)=>l.chapters.every((ch,chi)=>localStorage.getItem('c'+idx+'l'+li+'ch'+chi)==='1'))}).length;const col=p<25?'#ef4444':p<50?'#f59e0b':p<75?'#3b82f6':'#10b981';document.getElementById('summaryArea').innerHTML='<div class="summary-card"><div class="num">'+p+'%</div><div class="label">全体進捗率</div><div class="pbar-bg"><div class="pbar-fill" style="width:'+p+'%;background:'+col+'"></div></div></div><div class="summary-card"><div class="num">'+d+'/'+t+'</div><div class="label">完了チャプター数</div></div><div class="summary-card"><div class="num">'+cd+'/'+list.length+'</div><div class="label">完了コース数</div></div><div class="summary-card"><div class="num">'+list.length+'</div><div class="label">受講コース数</div></div>'}
function render(fi){const a=document.getElementById('courseArea');a.innerHTML='';const list=fi==='all'?courses:[courses[parseInt(fi)]];list.forEach((c,ci)=>{const s=document.createElement('div');s.className='course-section';const idx=fi==='all'?ci:parseInt(fi);let lh='';c.lessons.forEach((l,li)=>{let ch='';l.chapters.forEach((c2,chi)=>{const k='c'+idx+'l'+li+'ch'+chi;const ck=localStorage.getItem(k)==='1'?'checked':'';const dv=localStorage.getItem(k+'_date')||'';ch+='<div class="ch-row"><input type="checkbox" '+ck+' onchange="toggle(this,\''+k+'\')"><span class="ch-name">'+c2+'</span><input type="date" class="ch-date" value="'+dv+'" onchange="setDate(this,\''+k+'_date\')"></div>'});lh+='<div class="lesson-group"><div class="lesson-title"><span>'+l.name+'</span><span class="lesson-progress" id="lp_'+idx+'_'+li+'"></span></div>'+ch+'</div>'});s.innerHTML='<div class="course-header" onclick="toggleBody(this)"><h3>'+c.name+' <span class="badge">'+c.contents+'コンテンツ</span></h3><span class="arrow">▼</span></div><div class="course-body">'+lh+'</div>';a.appendChild(s)});updateSummary()}
function resetAll(){if(!confirm('全ての進捗データをリセットしますか？'))return;Object.keys(localStorage).forEach(k=>{if(k.startsWith('c'))localStorage.removeItem(k)});render(document.getElementById('courseFilter').value)}
function saveData(){const d={staff:document.getElementById('staffName').value,dept:document.getElementById('dept').value,startDate:document.getElementById('startDate').value,progress:{}};Object.keys(localStorage).forEach(k=>{if(k.startsWith('c'))d.progress[k]=localStorage.getItem(k)});const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(d.staff||'staff')+'_progress_'+new Date().toISOString().split('T')[0]+'.json';a.click()}
function loadData(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const r=new FileReader();r.onload=ev=>{const d=JSON.parse(ev.target.result);document.getElementById('staffName').value=d.staff||'';document.getElementById('dept').value=d.dept||'';document.getElementById('startDate').value=d.startDate||'';Object.keys(d.progress).forEach(k=>localStorage.setItem(k,d.progress[k]));render(document.getElementById('courseFilter').value)};r.readAsText(e.target.files[0])};i.click()}
function exportCSV(){let csv='\uFEFF"コース","レッスン","チャプター","完了","完了日"\n';const f=document.getElementById('courseFilter').value;const list=f==='all'?courses:[courses[parseInt(f)]];list.forEach((c,ci)=>{const idx=f==='all'?ci:parseInt(f);c.lessons.forEach((l,li)=>{l.chapters.forEach((ch,chi)=>{const k='c'+idx+'l'+li+'ch'+chi;const dn=localStorage.getItem(k)==='1'?'✓':'';const dt=localStorage.getItem(k+'_date')||'';csv+='"'+c.name+'","'+l.name+'","'+ch+'","'+dn+'","'+dt+'"\n'})})});const b=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='learning_progress_'+new Date().toISOString().split('T')[0]+'.csv';a.click()}
document.getElementById('courseFilter').addEventListener('change',function(){render(this.value)});
render('all');
