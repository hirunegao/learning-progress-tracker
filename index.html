var state={};
courses.forEach(function(c,ci){
  c.lessons.forEach(function(l,li){
    l.chapters.forEach(function(ch,chi){
      state[ci+'_'+li+'_'+chi]={done:false,date:''};
    });
  });
});

document.getElementById('startDate').value=new Date().toISOString().split('T')[0];

var sel=document.getElementById('courseFilter');
courses.forEach(function(c,i){
  var o=document.createElement('option');o.value=i;o.textContent=c.name;sel.appendChild(o);
});

function toggleBody(el){
  var body=el.nextElementSibling;
  body.style.display=body.style.display==='none'?'block':'none';
  var arrow=el.querySelector('.arrow');
  if(arrow)arrow.classList.toggle('open');
}

function toggleLesson(el){
  var items=el.nextElementSibling;
  if(items)items.style.display=items.style.display==='none'?'block':'none';
}

function toggle(ci,li,chi){
  var k=ci+'_'+li+'_'+chi;
  state[k].done=!state[k].done;
  state[k].date=state[k].done?new Date().toLocaleDateString('ja-JP'):'';
  var dateEl=document.getElementById('date_'+k);
  if(dateEl)dateEl.textContent=state[k].date;
  updateSummary();
}

function updateSummary(){
  var total=0,done=0,byC={};
  courses.forEach(function(c,ci){
    byC[ci]={total:0,done:0};
    c.lessons.forEach(function(l,li){
      l.chapters.forEach(function(ch,chi){
        total++;byC[ci].total++;
        if(state[ci+'_'+li+'_'+chi].done){done++;byC[ci].done++;}
      });
    });
  });
  var p=total>0?Math.round(done/total*100):0;
  var colors=['#10b981','#3b82f6','#8b5cf6','#f59e0b','#ef4444','#06b6d4','#ec4899','#84cc16'];
  var h='<div class="summary-card"><div class="num">'+p+'%<'+'/div><div class="label">全体進捗率<'+'/div><div class="pbar-bg"><div class="pbar-fill" style="width:'+p+'%;background:linear-gradient(90deg,#1a56db,#3b82f6)"><'+'/div><'+'/div><'+'/div>';
  h+='<div class="summary-card"><div class="num">'+done+'/'+total+'<'+'/div><div class="label">完了チャプター<'+'/div><'+'/div>';
  courses.forEach(function(c,ci){
    var cp=byC[ci].total>0?Math.round(byC[ci].done/byC[ci].total*100):0;
    h+='<div class="summary-card"><div class="num" style="color:'+colors[ci%8]+'">'+cp+'%<'+'/div><div class="label">'+c.name.substring(0,10)+'<'+'/div><div class="pbar-bg"><div class="pbar-fill" style="width:'+cp+'%;background:'+colors[ci%8]+'"><'+'/div><'+'/div><'+'/div>';
  });
  document.getElementById('summaryArea').innerHTML=h;
  // update course badges
  courses.forEach(function(c,ci){
    var badge=document.getElementById('badge_'+ci);
    if(badge){
      var cp=byC[ci].total>0?Math.round(byC[ci].done/byC[ci].total*100):0;
      badge.textContent=byC[ci].done+'/'+byC[ci].total+' ('+cp+'%)';
    }
  });
}

function render(filter){
  var h='';
  courses.forEach(function(c,ci){
    if(filter!=='all'&&parseInt(filter)!==ci)return;
    h+='<div class="course-section"><div class="course-header" onclick="toggleBody(this)"><span><span class="arrow">▶<'+'/span> '+c.name+' ('+c.contents+'コンテンツ)<'+'/span><span class="course-badge" id="badge_'+ci+'">0/0<'+'/span><'+'/div>';
    h+='<div class="course-body" style="display:none">';
    c.lessons.forEach(function(l,li){
      h+='<div class="lesson-group"><div class="lesson-title" onclick="toggleLesson(this)"><span>📚 '+l.name+'<'+'/span><span>'+l.chapters.length+'章<'+'/span><'+'/div><div class="ch-items">';
      l.chapters.forEach(function(ch,chi){
        var k=ci+'_'+li+'_'+chi;
        var checked=state[k].done?'checked':'';
        h+='<div class="ch-row"><input type="checkbox" '+checked+' onchange="toggle('+ci+','+li+','+chi+')"><span>'+ch+'<'+'/span><span class="date" id="date_'+k+'">'+state[k].date+'<'+'/span><'+'/div>';
      });
      h+='<'+'/div><'+'/div>';
    });
    h+='<'+'/div><'+'/div>';
  });
  document.getElementById('app').innerHTML=h;
  updateSummary();
}

function resetAll(){
  if(!confirm('全ての進捗データをリセットしますか？'))return;
  Object.keys(state).forEach(function(k){state[k]={done:false,date:''};});
  render(document.getElementById('courseFilter').value);
}

function saveData(){
  var d={staff:document.getElementById('staffName').value,dept:document.getElementById('dept').value,startDate:document.getElementById('startDate').value,state:state};
  var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='progress_'+document.getElementById('staffName').value+'_'+new Date().toISOString().split('T')[0]+'.json';a.click();
}

function loadData(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=function(e){
    var r=new FileReader();
    r.onload=function(ev){
      try{
        var d=JSON.parse(ev.target.result);
        if(d.staff)document.getElementById('staffName').value=d.staff;
        if(d.dept)document.getElementById('dept').value=d.dept;
        if(d.startDate)document.getElementById('startDate').value=d.startDate;
        if(d.state){Object.keys(d.state).forEach(function(k){if(state[k])state[k]=d.state[k];});}
        render(document.getElementById('courseFilter').value);
        alert('データを読み込みました');
      }catch(err){alert('読み込みエラー: '+err.message);}
    };
    r.readAsText(e.target.files[0]);
  };
  inp.click();
}

function exportCSV(){
  var rows=[['コース','レッスン','チャプター','完了','完了日']];
  courses.forEach(function(c,ci){
    c.lessons.forEach(function(l,li){
      l.chapters.forEach(function(ch,chi){
        var s=state[ci+'_'+li+'_'+chi];
        rows.push([c.name,l.name,ch,s.done?'○':'',s.date]);
      });
    });
  });
  var bom='\uFEFF';
  var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var b=new Blob([bom+csv],{type:'text/csv'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='progress_'+new Date().toISOString().split('T')[0]+'.csv';a.click();
}

document.getElementById('courseFilter').addEventListener('change',function(){render(this.value);});
render('all');
